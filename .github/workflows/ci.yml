name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # PHP lint — all theme and module PHP files
      - name: PHP lint
        run: find dolibarr/ -name '*.php' -print0 | xargs -0 -n1 php -l

      # JS syntax check
      - name: JS check
        run: node --check dolibarr/custom/novoux/theme/novo/novo.js

      # The distribution zip is what users and DoliStore actually receive, so
      # assert its shape rather than trusting the packaging script.
      - name: Package and verify the distribution zip
        run: |
          bash scripts/package.sh
          zip=$(ls module_novoux-*.zip)
          fail=0
          for required in \
            novoux/core/modules/modNovoux.class.php \
            novoux/theme/novo/style.css.php \
            novoux/langs/en_US/novoux.lang \
            novoux/docs/LICENSE \
            novoux/docs/INSTALL.md; do
            if ! unzip -l "$zip" | grep -q " $required$"; then
              echo "::error::$zip is missing $required"; fail=1
            fi
          done
          # Dev-only files must not ship.
          for forbidden in novoux/test/ novoux/.gitkeep; do
            if unzip -l "$zip" | grep -q " $forbidden"; then
              echo "::error::$zip contains $forbidden"; fail=1
            fi
          done
          # The licence must be the real text, not an empty placeholder.
          if [ "$(unzip -p "$zip" novoux/docs/LICENSE | wc -l)" -lt 100 ]; then
            echo "::error::novoux/docs/LICENSE looks truncated"; fail=1
          fi
          rm -f "$zip"
          exit $fail

      # Palette & variant freshness
      - name: Build palettes
        run: node scripts/build-palettes.js
      - name: Check generated files are up to date
        run: |
          git diff --exit-code dolibarr/custom/novoux/theme/novo/palettes/
          git diff --exit-code dolibarr/custom/novoux/theme/novo/variants/

  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:12.3
        env:
          MYSQL_ROOT_PASSWORD: dolibarr
          MYSQL_DATABASE: dolibarr
        ports: ['3306:3306']
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=3s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: mysqli, gd, intl, zip, calendar
          tools: phpunit:10

      - name: Install Dolibarr
        run: |
          git clone --depth=1 --branch=develop https://github.com/Dolibarr/dolibarr.git /tmp/dolibarr
          mkdir -p /tmp/dolibarr/documents

          cat > /tmp/dolibarr/htdocs/conf/conf.php << 'EOF'
          <?php
          $dolibarr_main_url_root='http://127.0.0.1';
          $dolibarr_main_document_root='/tmp/dolibarr/htdocs';
          $dolibarr_main_data_root='/tmp/dolibarr/documents';
          $dolibarr_main_db_host='127.0.0.1';
          $dolibarr_main_db_port='3306';
          $dolibarr_main_db_name='dolibarr';
          $dolibarr_main_db_prefix='llx_';
          $dolibarr_main_db_user='root';
          $dolibarr_main_db_pass='dolibarr';
          $dolibarr_main_db_type='mysqli';
          $dolibarr_main_db_character_set='utf8';
          $dolibarr_main_db_collation='utf8_unicode_ci';
          $dolibarr_main_authentication='dolibarr';
          $dolibarr_main_instance_unique_id='ci1234567890';
          EOF

          cat > /tmp/dolibarr/htdocs/install/install.forced.php << 'EOF'
          <?php
          $force_install_noedit=2;
          $force_install_type='mysqli';
          $force_install_port=3306;
          $force_install_dbserver='127.0.0.1';
          $force_install_database='dolibarr';
          $force_install_databaselogin='root';
          $force_install_databasepass='dolibarr';
          $force_install_prefix='llx_';
          $force_install_dolibarrlogin='admin';
          $force_install_main_url='http://127.0.0.1';
          EOF

          cd /tmp/dolibarr/htdocs/install
          php step2.php set
          php step5.php 0.0.0 0.0.0

      - name: Copy module and theme into Dolibarr
        run: |
          cp -r $GITHUB_WORKSPACE/dolibarr/custom/novoux /tmp/dolibarr/htdocs/custom/novoux

      - name: Run PHPUnit
        working-directory: /tmp/dolibarr/htdocs
        run: phpunit --testdox custom/novoux/test/phpunit/

  # Boots a real Dolibarr with the theme active and asserts it actually loads.
  # `php -l` and the PHPUnit descriptor test never execute style.css.php, which
  # is how the broken main.inc.php include in #12 shipped.
  smoke:
    name: smoke (Dolibarr ${{ matrix.dolibarr }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The compatibility range the module declares in modNovoux.class.php and
        # advertises on DoliStore. Both ends are exercised, so the claim cannot
        # quietly become false.
        dolibarr: ['21.0.0', '22', '23', '24']
    env:
      DOLI_IMAGE: dolibarr/dolibarr:${{ matrix.dolibarr }}
      COMPOSE: docker compose -f docker-compose.dev.yml -f docker-compose.version.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Dolibarr
        run: $COMPOSE up -d

      - name: Wait for Dolibarr to install
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200" ]; then
              echo "Dolibarr up after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "::error::Dolibarr did not come up in time"
          $COMPOSE logs web | tail -50
          exit 1

      # Packaging rule: the module must work from htdocs/custom/<mod> AND
      # htdocs/<mod>. The compose file only provides the former.
      - name: Deploy module to the second supported install root
        run: |
          WEB="$($COMPOSE ps -q web)"
          docker exec "$WEB" rm -rf /var/www/html/novoux
          docker exec "$WEB" mkdir -p /var/www/html/novoux
          docker cp dolibarr/custom/novoux/. "$WEB:/var/www/html/novoux"

      - name: Seed test data and activate the module
        run: bash scripts/seed-dev.sh

      - name: Run smoke tests
        env:
          TEST_SECOND_ROOT: '1'
        run: npm run test:smoke

      # display_errors is off in the dolibarr image, so PHP diagnostics never
      # reach the response body and no assertion on it can see them. The server
      # log is the only place they surface. #43 (12 partials silently failing to
      # include on every request) was invisible to the suite for exactly this
      # reason.
      - name: Fail on PHP warnings or errors in the server log
        run: |
          if $COMPOSE logs web 2>&1 \
               | grep -E 'php:(warn|error)' > /tmp/php-diagnostics.log; then
            echo "::error::PHP emitted warnings or errors while serving the test run"
            sort -u /tmp/php-diagnostics.log | head -40
            exit 1
          fi
          echo "no PHP warnings or errors logged"

      - name: Dump Dolibarr logs on failure
        if: failure()
        run: $COMPOSE logs web | tail -100

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: smoke-test-results-${{ matrix.dolibarr }}
          path: tests/smoke/test-results/
          retention-days: 7

  # Standardized org-wide required check: aggregates all CI jobs into a single
  # status named `ok`. See FlowMatrix-AI/eng-governance for the convention.
  ok:
    name: ok
    needs: [validate, phpunit, smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "needs results: $results"
          case "$results" in
            *failure*|*cancelled*) echo "::error::a required CI job did not succeed"; exit 1 ;;
          esac
          echo "ok"
