name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # package.sh names the zip from package.json while the upload step looks
      # for the tag's name, so a mismatch would publish a release with no zip.
      - name: Tag matches the version strings
        run: bash scripts/check-version.sh "$GITHUB_REF_NAME"

      # Ensure palettes are fresh
      - run: node scripts/build-palettes.js

      # Build zip
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package.sh
          echo "ZIPFILE=module_novoux-${VERSION}.zip" >> "$GITHUB_ENV"

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: ${{ env.ZIPFILE }}
          generate_release_notes: true
          draft: false
          prerelease: false
