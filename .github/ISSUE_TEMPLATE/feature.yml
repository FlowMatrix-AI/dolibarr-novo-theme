name: Feature request
description: Suggest an improvement to the theme or the module.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Novo is community-supported and maintained on a best-effort basis. Ideas
        are welcome; there is no commitment to implement them.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The situation you are in, rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Theme appearance / CSS
        - Palettes or density
        - Dark mode
        - NovouX admin settings
        - Per-user preferences
        - Packaging or install
        - Documentation
        - Other
    validations:
      required: false
